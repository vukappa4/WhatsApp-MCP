name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (v0.2.0, or v0.2.0-rc.1 for a prerelease)
# on a commit of main tests the tagged commit, then GoReleaser
# (.goreleaser.yaml) publishes the binaries and checksums.txt as a GitHub
# release. A tag on a commit outside main publishes nothing.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag outside main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main: only a commit of main publishes a release"
            exit 1
          fi
      - name: Make only the highest vX.Y.Z the latest release
        run: |
          highest=$(git tag --list 'v*' | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then latest=true; else latest=false; fi
          echo "MAKE_LATEST=$latest" >> "$GITHUB_ENV"
          echo "$GITHUB_REF_NAME: make_latest $latest (highest vX.Y.Z tag: $highest)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: a release builds from a clean module download.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
