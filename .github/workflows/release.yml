name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (v0.2.0, or v0.2.0-rc.1 for a prerelease)
# tests the tagged commit, then GoReleaser (.goreleaser.yaml) publishes the
# binaries and checksums.txt as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: a release builds from a clean module download.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
